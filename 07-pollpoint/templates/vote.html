{% extends "base.html" %}
{% block title %}Vote · PollPoint{% endblock %}
{% block content %}
<section class="card" style="max-width:560px; margin:0 auto">
  <h1>{{ poll.question }}</h1>
  <form method="post" action="/p/{{ poll.id }}/vote" style="display:grid; gap:12px">
    {% for o in options %}
      <button type="submit" name="option" value="{{ o.id }}" style="text-align:left; font-size:1.15rem; padding:18px 20px">{{ o.label }}</button>
    {% endfor %}
  </form>
  <p class="muted">One vote per phone. Results appear live on the big screen.</p>
</section>
{% endblock %}
